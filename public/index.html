<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Member Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gym Member Register</h1>
    <p>CA Lab Practice &middot; Set 1</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Members</button>
          <button id="top-three" type="button">Top 3 Visitors</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by plan</h2>
        <form id="search-form" class="inline">
          <select name="plan" required>
            <option value="">Choose a plan...</option>
            <option value="Basic">Basic</option>
            <option value="Gold">Gold</option>
            <option value="Platinum">Platinum</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Visits at least
            <input type="number" name="minVisits" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Member</h2>
        <form id="add-form" class="stack">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Plan
          <select name="plan" required>
            <option value="">Choose...</option>
            <option value="Basic">Basic</option>
            <option value="Gold">Gold</option>
            <option value="Platinum">Platinum</option>
          </select>
        </label>
        <label>City
          <input type="text" name="city" required>
        </label>
        <label>Visits
          <input type="number" name="visits" step="1" required>
        </label>
          <button type="submit">Add Member</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
